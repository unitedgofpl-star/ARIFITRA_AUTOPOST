name: Robot Posting

# Dipanggil Cloudflare setiap 15 menit, oleh bot (/terbitkan), atau manual.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Uji coba tanpa posting (1 = ya)"
        default: "0"
  schedule:
    - cron: "41 * * * *"   # cadangan bila Cloudflare belum dipasang

permissions:
  contents: write

concurrency:
  group: robot-posting
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Terbitkan konten yang sudah jatuh tempo
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/publish.py
      - name: Simpan catatan status
        if: always()
        run: |
          git config user.name "robot-posting"
          git config user.email "robot-posting@users.noreply.github.com"
          git add queue/*/status.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Catat status posting"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 3; done
