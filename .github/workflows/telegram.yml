name: Bot Telegram Kantor

on:
  schedule:
    - cron: "*/5 * * * *"   # bot hidup ±5 menit per putaran, lalu disambung putaran berikutnya
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-kantor
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Siapkan git
        run: |
          git config user.name "kantor-asn-go-digital"
          git config user.email "kantor-asn-go-digital@users.noreply.github.com"
      - name: Jalankan bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_MODEL_BIG: ${{ vars.CLAUDE_MODEL_BIG }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          RUN_SECONDS: "290"
        run: python bot/telegram_bot.py
