name: Bot Telegram Kantor

# Dibangunkan oleh Cloudflare Worker setiap kali Anda mengirim pesan ke bot.
on:
  workflow_dispatch:
    inputs:
      update:
        description: "Pesan Telegram (diisi otomatis oleh Cloudflare; kosongkan untuk mode polling)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Siapkan git
        run: |
          git config user.name "kantor-asn-go-digital"
          git config user.email "kantor-asn-go-digital@users.noreply.github.com"
      - name: Jalankan bot
        env:
          UPDATE_JSON: ${{ github.event.inputs.update }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_MODEL_BIG: ${{ vars.CLAUDE_MODEL_BIG }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          RUN_SECONDS: "280"
        run: python bot/telegram_bot.py
