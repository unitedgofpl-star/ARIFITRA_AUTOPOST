name: Robot Posting

on:
  schedule:
    - cron: "*/30 * * * *"   # cek antrean tiap 30 menit (jadwal GitHub bisa telat beberapa menit)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Uji coba tanpa posting (1 = ya)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: robot-kantor
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Terbitkan konten yang sudah jatuh tempo
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/publish.py
      - name: Simpan catatan status
        if: always()
        run: |
          git config user.name "robot-posting"
          git config user.email "robot-posting@users.noreply.github.com"
          git add queue/*/status.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Catat status posting" && git push)
